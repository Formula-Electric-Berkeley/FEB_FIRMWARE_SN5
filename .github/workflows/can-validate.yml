name: CAN Definitions Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generated-files:
    name: Generated Files Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate generated files
        working-directory: common/FEB_CAN_Definitions
        run: |
          set +e
          OUTPUT=$(./generate_can.sh --check 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "### Generated Files Check Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**To fix:** Run \`./generate_can.sh\` in \`common/FEB_CAN_Definitions\` and commit the changes." >> "$GITHUB_STEP_SUMMARY"
            exit $EXIT_CODE
          else
            echo "### Generated Files Check" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All CAN library generated files are up to date." >> "$GITHUB_STEP_SUMMARY"
          fi
